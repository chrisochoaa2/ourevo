<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Revelation Outdoors at the University of Oklahoma — a simple link hub for the ministry launch."
    />
    <title>Revelation Outdoors | OU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hub-shell" aria-label="Revelation Outdoors link hub">
        <div class="brand-strip"></div>

        <div class="layout">
          <section class="intro">
            <p class="eyebrow">University of Oklahoma • Fall 2026</p>
            <img
              class="brand-mark"
              src="https://images.squarespace-cdn.com/content/v1/5c38b67875f9ee9ed6e7c649/38c849f1-90cb-4a06-9586-1ffc9335c4dc/Alt+Logo+Stacked_White.png"
              alt="Revelation Outdoors"
            />
            <nav class="link-list" aria-label="Primary links">
              <a
                class="link-card main"
                href="https://www.revelationoutdoors.com/"
                target="_blank"
                rel="noreferrer noopener"
              >
                <span class="link-label">Main Website</span>
                <span class="link-note">Visit the official ministry site</span>
              </a>

              <a
                class="link-card"
                href="https://www.instagram.com/oklahomarevo"
                target="_blank"
                rel="noreferrer noopener"
              >
                <span class="link-label">Instagram</span>
                <span class="link-note">Follow updates and event posts</span>
              </a>

              <a
                class="link-card"
                href="https://docs.google.com/forms/d/e/1FAIpQLSfRytgamb10pMgnwSCG437rIL9dkbwDYa3467GV_c2sJELMeQ/viewform?usp=sharing&ouid=103142690018907959200"
                target="_blank"
                rel="noreferrer noopener"
              >
                <span class="link-label">Join Interest Form</span>
                <span class="link-note">Fill out the Google Form to get connected</span>
              </a>

              <a
                class="link-card"
                href="https://groupme.com/join_group/116742270/ZlDLhQCO"
                target="_blank"
                rel="noreferrer noopener"
              >
                <span class="link-label">Join GroupMe</span>
                <span class="link-note">Jump into the student group chat</span>
              </a>
            </nav>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
